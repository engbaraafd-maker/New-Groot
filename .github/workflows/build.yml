name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: |
          unzip -o groot.zip -d w
          cd w/groot
          bash prepare_android.sh
          echo "android.newDsl=false" >> android/gradle.properties
          flutter test || true
          flutter build apk --release || flutter build apk --release --android-skip-build-dependency-validation
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: w/groot/build/app/outputs/flutter-apk/app-release.apk
